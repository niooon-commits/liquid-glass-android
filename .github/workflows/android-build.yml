name: Build & Release Android App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Liquid Glass APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Ensure Executable Permissions
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: "my-upload-key.jks"
          STORE_PASSWORD: "nutritrack123"
          KEY_ALIAS: "upload"
          KEY_PASSWORD: "nutritrack123"
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Verify & Prepare APK
        run: |
          echo "Checking release build outputs..."
          ls -la android/app/build/outputs/apk/release/
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          mkdir -p release-dist
          cp "$APK_FILE" release-dist/liquid-glass-app.apk
          ls -lh release-dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-app-apk
          path: release-dist/liquid-glass-app.apk
          if-no-files-found: error

      - name: Publish or Replace APK in GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          APK_FILE="release-dist/liquid-glass-app.apk"
          TITLE="Liquid Glass Android App (Latest Release)"
          NOTES="### 📱 Liquid Glass Android Application - Continuous Build\n\n- **Package**: \`com.niooon.liquidglass\`\n- **Build Commit**: \`${{ github.sha }}\`\n- **Keystore Signature**: Consistent & Permanent (SHA-1: \`64:50:AE:47:2D:0B:9B:4C:5C:EC:3D:DE:7A:CA:A6:5C:39:32:50:A3\`)\n\n> 🔄 *This release post is continuously updated on every build. The previous APK is automatically replaced with the new build so you always have the latest version in a single place without duplicate releases.*"

          # Update git tag to point to latest commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG" || true

          # Check if the release already exists
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release '$TAG' already exists. Replacing APK artifact..."
            gh release upload "$TAG" "$APK_FILE" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$(echo -e "$NOTES")"
            echo "Successfully updated and replaced APK in release '$TAG'!"
          else
            echo "Creating initial release '$TAG'..."
            gh release create "$TAG" "$APK_FILE" \
              --title "$TITLE" \
              --notes "$(echo -e "$NOTES")"
            echo "Successfully created release '$TAG' with APK!"
          fi
